services:
  vngportal:
    container_name: vngportal
    depends_on:
       - vngtriplestore
       - vngservice
    image: vngportal:1.22
    ports:
      - "1145:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_DbgEnableMiniDump=1
      - DOTNET_DbgMiniDumpType=2            # 2 = heap dump; 4 = full dump
      - DOTNET_DbgMiniDumpName=/vng/portal/dumps/crash-%p.dmp
      - DOTNET_EnableCrashReport=1          # writes crash-<pid>.dmp.crashreport.json with the native stack
    volumes:
      - C:\vng\portal:/vng/portal
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    cap_add:
      - SYS_PTRACE                          # lets createdump attach on locked-down hosts
    stop_grace_period: 60s
    restart: unless-stopped

  vngtriplestore:
    container_name: vngtriplestore    
    depends_on:
      - vngservice
    image: vngtriplestore:1.16
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: admin123
      JVM_ARGS: >-
        -Xmx2g
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/fuseki/dumps/
        -XX:ErrorFile=/fuseki/dumps/hs_err_pid%p.log
        -XX:+ExitOnOutOfMemoryError
      JAVA_OPTIONS: "-Djava.library.path=/usr/lib"
    volumes:
      - fuseki_data:/fuseki
    stop_grace_period: 30s
    restart: unless-stopped

  vngservice:
    container_name: vngservice
    image: vngservice:1.15
    ports:
      - "1140:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_DbgEnableMiniDump=1
      - DOTNET_DbgMiniDumpType=2            # 2 = heap dump; 4 = full dump
      - DOTNET_DbgMiniDumpName=/vng/service/dumps/crash-%p.dmp
      - DOTNET_EnableCrashReport=1          # writes crash-<pid>.dmp.crashreport.json with the native stack
    volumes:
      - service_data:/vng/service
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    cap_add:
      - SYS_PTRACE                          # lets createdump attach on locked-down hosts
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  fuseki_data:
  service_data:
  dataprotection_keys:  