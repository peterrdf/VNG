services:
  vngportal:
    image: vngportal:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prebuilt
    ports:
      - "1140:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - vng_data:/vng/portal
    restart: unless-stopped

volumes:
  vng_data: